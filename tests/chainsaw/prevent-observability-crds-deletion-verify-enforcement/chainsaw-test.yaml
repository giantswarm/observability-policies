apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: prevent-observability-crds-deletion-verify-enforcement
spec:
  concurrent: false
  steps:
  - name: verify CRD exists before test
    try:
    - assert:
        resource:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: prometheusrules.monitoring.coreos.com
  - name: attempt to delete protected CRD and expect block
    try:
    - delete:
        ref:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          name: prometheusrules.monitoring.coreos.com
        expect:
        - check:
            (contains($error, 'prevent-observability-crds-deletion')): true
  - name: verify CRD still exists after blocked deletion
    try:
    - assert:
        resource:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: prometheusrules.monitoring.coreos.com
  - name: verify webhook registers only DELETE for CustomResourceDefinition
    try:
    - script:
        content: |
          set -eu
          ops=$(kubectl get validatingwebhookconfiguration -l webhook.kyverno.io/managed-by=kyverno -o json \
            | jq -c '[.items[].webhooks[].rules[] | select(.resources | index("customresourcedefinitions")) | .operations] | add | unique')
          echo "customresourcedefinitions operations: $ops"
          test "$ops" = '["DELETE"]'
  - name: verify UPDATE of protected CRD is still allowed
    try:
    - script:
        content: |
          set -eu
          kubectl label crd prometheusrules.monitoring.coreos.com a3-update-test=true --overwrite
          kubectl label crd prometheusrules.monitoring.coreos.com a3-update-test-
